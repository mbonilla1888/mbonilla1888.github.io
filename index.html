<div class="watermark">
    {{#eq group.orderStatus "CANCEL"}}
        Canceled
    {{else}}
        {{#eq group.orderStatus "CANCELED"}}
            Canceled
        {{else}}
            {{#eq group.orderStatus "CANCELLED"}}
                Canceled
            {{else}}
                {{@root.$localizedResource.orderNotComplete}}
            {{/eq}}
        {{/eq}}
    {{/eq}}
</div>
