<meta charset="UTF-8">

<style>
    .watermark-container {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        width: 100%;
        height: 100%;
    }

    .watermark {
        color: rgba(0, 0, 0, 0.10);
        font-weight: 300;
        font-size: 30pt;
        display: flex;
        margin-bottom: 1.5cm;
        margin-left: 0.7cm;
    }
</style>

{{#each $pdf.pages}}
    {{#if @index}}
        <div style="page-break-before: always;"></div>
    {{/if}}

    {{#with (getWatermarkText group.orderStatus @root.$localizedResource.orderNotComplete) as |watermarkText|}}
        <div class="watermark-container">
            <div class="watermark">{{watermarkText}}</div>
        </div>
    {{/with}}
{{/each}}
